name: Validate Report Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check generated packages
        run: python scripts/check_generated.py

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Scan public content
        run: python scripts/scan_public_content.py

      - name: Validate evaluation contracts
        run: python scripts/validate_eval_suite.py

      - name: Validate behavioral benchmark plan without model calls
        run: python scripts/run_behavioral_benchmark.py --dry-run

      - name: Validate trigger-evaluation plan without model calls
        run: python scripts/run_trigger_evals.py --dry-run

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate isolated standalone packages
        run: python scripts/test_standalone_packages.py
